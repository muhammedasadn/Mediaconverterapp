#cloud-config
# ----------------------------------------------------------------------------
# Universal Media Converter — Hardened Cloud-Init Configuration (ARM64 Ubuntu 24.04)
# Production Security, 4GB Swap, Docker CE, UFW, Fail2ban, Non-Root Isolation
# ----------------------------------------------------------------------------

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - ufw
  - fail2ban
  - unattended-upgrades
  - htop
  - iotop
  - ncdu
  - jq

users:
  - default
  - name: converter
    gecos: Universal Media Converter Service Account
    primary_group: converter
    groups: [docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    system: true

groups:
  - converter

write_files:
  # 1. SSH Hardening Configuration
  - path: /etc/ssh/sshd_config.d/99-hardened-converter.conf
    permissions: '0644'
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      ChallengeResponseAuthentication no
      X11Forwarding no
      MaxAuthTries 4
      ClientAliveInterval 300
      ClientAliveCountMax 2

  # 2. Automated Daily Security Updates
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  # 3. Docker Daemon Daemon Configuration (Log Rotation to prevent disk bloat)
  - path: /etc/docker/daemon.json
    permissions: '0644'
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "50m",
          "max-file": "3"
        },
        "live-restore": true,
        "userland-proxy": false,
        "icc": false
      }

  # 4. Kernel Tuning for FFmpeg Bursts and Swap
  - path: /etc/sysctl.d/99-converter-tuning.conf
    permissions: '0644'
    content: |
      vm.swappiness=10
      vm.vfs_cache_pressure=50
      fs.file-max=2097152
      net.core.somaxconn=1024
      net.ipv4.tcp_max_syn_backlog=2048

  # 5. Metadata & Egress Protection Startup Script
  - path: /usr/local/bin/setup-egress-security.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      echo "Applying Container Egress Isolation & OCI Metadata Shield..."
      # Block docker bridge containers from accessing OCI Instance Metadata Service (169.254.169.254)
      iptables -I DOCKER-USER -d 169.254.169.254 -j DROP || true
      # Block docker bridge containers from accessing local link-local range
      iptables -I DOCKER-USER -d 169.254.0.0/16 -j DROP || true
      echo "Egress security rules applied."

runcmd:
  # 1. Create and Activate 4GB Swap File (Crucial for 2 OCPU FFmpeg memory spikes)
  - fallocate -l 4G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # 2. Apply Kernel Sysctl Parameters
  - sysctl --system

  # 3. Install Official Docker CE Engine & Compose Plugin
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker

  # 4. Prepare Shared Media Storage Directory
  - mkdir -p /var/lib/media-storage/uploads /var/lib/media-storage/output
  - chown -R 10001:10001 /var/lib/media-storage
  - chmod -R 775 /var/lib/media-storage

  # 5. Configure UFW Firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH'
  - ufw allow 80/tcp comment 'HTTP ACME'
  - ufw allow 443/tcp comment 'HTTPS Caddy'
  - ufw allow 443/udp comment 'HTTP3 QUIC Caddy'
  - ufw --force enable

  # 6. Apply Metadata Protection & Add to Systemd Boot
  - /usr/local/bin/setup-egress-security.sh

  # 7. Configure and Start Fail2ban
  - systemctl enable fail2ban
  - systemctl restart fail2ban

  # 8. Restart SSH Daemon with hardened config
  - systemctl restart ssh || systemctl restart sshd

final_message: "Universal Media Converter Oracle VM initialization completed successfully in $UPTIME seconds."
