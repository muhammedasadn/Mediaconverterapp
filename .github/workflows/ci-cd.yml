name: CI/CD & Zero-Cost Production Deployment

on:
  push:
    branches: [main, chore/v5-deployment]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Verification: Typecheck, Lint, and Fast Native Unit Testing
  # --------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 22 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck monorepo
        run: pnpm run typecheck

      - name: Run unit & security test suite
        run: pnpm test

      - name: Build static web export
        run: pnpm --filter @universal/web build

  # --------------------------------------------------------------------------
  # 2. Build & Push Multi-Arch ARM64/AMD64 Docker Images to GHCR
  # --------------------------------------------------------------------------
  build-and-push:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64,linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository name for Docker tagging
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Build and Push Fastify API Image
      - name: Build & Push API Image (ARM64 & AMD64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-api:latest
            ghcr.io/${{ env.REPO_LOWER }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and Push Native FFmpeg Worker Image
      - name: Build & Push Worker Image (ARM64 & AMD64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-worker:latest
            ghcr.io/${{ env.REPO_LOWER }}-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # 3. Production Deployment via SSH with Healthcheck Gating & Auto-Rollback
  # --------------------------------------------------------------------------
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # Protected environment requiring manual approval
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH and Execute Remote Zero-Downtime Deployment
        if: env.VM_HOST != ''
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER || 'converter' }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

          echo "🚀 Executing deployment on Oracle VM ($VM_HOST)..."
          ssh -i ~/.ssh/id_ed25519 "$VM_USER@$VM_HOST" \
            "cd /opt/universal-media && ./scripts/deploy.sh $IMAGE_TAG"

      - name: Execute Post-Deployment Smoke Tests
        if: env.VM_HOST != ''
        env:
          WEB_URL: ${{ secrets.PRODUCTION_WEB_URL || 'https://universalmediaconverter.pages.dev' }}
          API_URL: ${{ secrets.PRODUCTION_API_URL || 'https://api.universalmediaconverter.app' }}
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh "$WEB_URL" "$API_URL"
